name: OpenSUSE build repro (temporary)

on:
  push:
    branches: [ci-opensuse-repro]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["opensuse/leap:15.5", "opensuse/leap:16.0"]
    steps:
      - name: Install system dependencies (incl. git, needed by checkout)
        run: |
          zypper --non-interactive refresh
          zypper --non-interactive install -y \
            R-base R-base-devel gcc-c++ gcc make git-core tar gzip curl jq \
            eigen3-devel netcdf-devel

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install R package dependencies
        id: rdeps
        continue-on-error: true
        run: |
          Rscript -e 'install.packages(c("Rcpp","data.table","dplyr","ncdf4","bigleaf","lubridate"), repos="https://cloud.r-project.org")' 2>&1 | tee /tmp/build.log

      - name: R CMD INSTALL (what install_github does under the hood)
        id: install
        if: always()
        continue-on-error: true
        run: |
          echo "=== R CMD INSTALL ===" | tee -a /tmp/build.log
          R CMD INSTALL --preclean . 2>&1 | tee -a /tmp/build.log
          exit "${PIPESTATUS[0]}"

      - name: Smoke test
        id: smoke
        if: always()
        continue-on-error: true
        run: |
          echo "=== Smoke test ===" | tee -a /tmp/build.log
          Rscript -e 'library(CASSIA); cat("CASSIA loaded OK, version:", as.character(packageVersion("CASSIA")), "\n")' 2>&1 | tee -a /tmp/build.log
          exit "${PIPESTATUS[0]}"

      - name: Record real outcome in the log
        if: always()
        run: |
          {
            echo "=== SUMMARY ==="
            echo "rdeps outcome:   ${{ steps.rdeps.outcome }}"
            echo "install outcome: ${{ steps.install.outcome }}"
            echo "smoke outcome:   ${{ steps.smoke.outcome }}"
          } | tee -a /tmp/build.log

      - name: Push build log to a per-image branch via API (no git push needed)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          safe_image=$(echo "${{ matrix.image }}" | tr '/:.' '___')
          branch="ci-logs/${safe_image}"
          repo="${{ github.repository }}"
          base_sha=$(curl -s -H "Authorization: token ${GH_TOKEN}" "https://api.github.com/repos/${repo}/git/ref/heads/ci-opensuse-repro" | jq -r .object.sha)
          curl -s -X POST -H "Authorization: token ${GH_TOKEN}" "https://api.github.com/repos/${repo}/git/refs" -d "{\"ref\":\"refs/heads/${branch}\",\"sha\":\"${base_sha}\"}" || true
          content_b64=$(base64 -w0 /tmp/build.log)
          existing_sha=$(curl -s -H "Authorization: token ${GH_TOKEN}" "https://api.github.com/repos/${repo}/contents/ci-logs/${safe_image}.log?ref=${branch}" | jq -r '.sha // empty')
          jq -n --arg msg "CI log for ${{ matrix.image }}" --arg content "$content_b64" --arg branch "$branch" --arg sha "$existing_sha" '{message:$msg, content:$content, branch:$branch} + (if $sha != "" then {sha:$sha} else {} end)' > /tmp/payload.json
          curl -s -X PUT -H "Authorization: token ${GH_TOKEN}" "https://api.github.com/repos/${repo}/contents/ci-logs/${safe_image}.log" -d @/tmp/payload.json
